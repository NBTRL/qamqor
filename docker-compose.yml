name: club-volunteers
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: club
      POSTGRES_PASSWORD: club_local_only
      POSTGRES_DB: club
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 15
  redis:
    image: redis:7
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 15
  minio:
    image: club-minio-local:2025-10-15
    build: { context: ./infra/minio, target: minio }
    pull_policy: build
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-club_local_key}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-local_minio_only_change_me}
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 30
  minio-init:
    image: club-minio-client-local:2025-08-13
    build: { context: ./infra/minio, target: mc }
    pull_policy: build
    depends_on:
      minio: { condition: service_healthy }
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-club_local_key}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-local_minio_only_change_me}
      S3_BUCKET: ${S3_BUCKET:-club-local}
    entrypoint: ['/bin/sh', '-ec']
    command:
      - |
        attempts=0
        until mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" >/dev/null 2>&1; do
          attempts=$$((attempts + 1))
          if [ "$$attempts" -ge 60 ]; then echo 'MinIO is unavailable'; exit 1; fi
          sleep 2
        done
        mc mb --ignore-existing "local/$$S3_BUCKET"
        mc anonymous set none "local/$$S3_BUCKET"
  mailpit:
    image: axllent/mailpit:v1.27.4
    restart: unless-stopped
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit_data:/data
volumes:
  postgres_data:
  redis_data:
  minio_data:
  mailpit_data:
