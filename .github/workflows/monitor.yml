name: Monitor Qamqor production

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_run:
    workflows: [Publish Qamqor after checks]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qamqor-production-monitor
  cancel-in-progress: false

jobs:
  health:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pinned official CLI
        run: npm install --prefix "$RUNNER_TEMP/qamqor-cli" --ignore-scripts --no-audit --no-fund vercel@65.10.0
      - name: Verify production API, worker and runtime errors
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_CLI_ENTRY: ${{ runner.temp }}/qamqor-cli/node_modules/vercel/dist/index.js
        run: node scripts/production-monitor.mjs
