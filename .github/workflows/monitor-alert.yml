name: Notify Qamqor monitor failures

on:
  workflow_run:
    workflows: [Monitor Qamqor production]
    types: [completed]

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: qamqor-monitor-alert
  cancel-in-progress: false

jobs:
  notify:
    if: >-
      github.repository == 'NBTRL/qamqor' && github.ref == 'refs/heads/main' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.workflow_id == 405941521 &&
      github.event.workflow_run.head_repository.full_name == 'NBTRL/qamqor'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Open one failure issue or close it on recovery
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/monitor-alert.mjs
