packages:
  - apps/*
  - packages/*
overrides:
  # Lighthouse SDK поддерживает стабильный OpenTelemetry API 1.9.
  '@opentelemetry/api': 1.9.0
  webpack: 5.112.0
  # Исправления advisory в зависимостях Next 15 и Nest 11 без смены их major-версий.
  'next@15>postcss': 8.5.23
  '@nestjs/swagger>js-yaml': 5.4.1
  '@nestjs/platform-express>multer': 2.5.0
allowBuilds:
  '@nestjs/core': true
  '@prisma/engines': true
  '@scarf/scarf': false
  esbuild: true
  msgpackr-extract: false
  prisma: true
  sharp: true
  unrs-resolver: true
